baseurl: ''
url: 'https://mobconverge.com'
permalink: pretty
title: 'Mobconverge, LLC'
description: 'Expert-led mobile & web development. Native iOS, Android, and web engineering services.'
lang: 'en'
locale: 'en_US'
theme_color: '#1b3a6b'

logo:
  mobile: "images/logo-small.png"
  mobile_height: "34px"
  mobile_width: "34px"
  desktop: "images/logo.png"
  desktop_height: "34px"
  desktop_width: "205px"

collections:
  services:
    output: true
    permalink: /services/:name/
    sort_by: weight

defaults:
  - scope:
      path: ""
    values:
      image: "/images/og-share.jpg"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"

# Jekyll skips dot-directories unless they are explicitly included.
include:
  - .well-known

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
